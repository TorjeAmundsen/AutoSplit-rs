[package]
name = "autosplit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
autosplit-capture = { version = "0.1.0", path = "../autosplit-capture" }
autosplit-core = { version = "0.1.0", path = "../autosplit-core" }
autosplit-input = { version = "0.1.0", path = "../autosplit-input" }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media", "Win32_System_Console", "Win32_Globalization"] }

[dev-dependencies]
test-case = "3.3.1"

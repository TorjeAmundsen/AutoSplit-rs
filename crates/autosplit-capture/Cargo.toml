[package]
name = "autosplit-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
autosplit-core = { path = "../autosplit-core" }
multiversion = "0.9.0"
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake"] }
linuxvideo = "0.3.5"
libc = "0.2"

[dev-dependencies]
libtest-mimic = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
test-case = "3.3.1"

[[test]]
name = "golden"
harness = false

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"

[workspace]
resolver = "3"
members = ["crates/autosplit-core", "crates/autosplit-cli", "crates/autosplit-capture", "crates/autosplit-input"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
# slice::as_chunks needs 1.88
rust-version = "1.88"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
resolver = "3"
members = ["crates/autosplit-core", "crates/autosplit-cli", "crates/autosplit-capture", "crates/autosplit-input"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
# Slint 1.18 needs 1.92
rust-version = "1.92"

[profile.release]
lto = "fat"
strip = true
codegen-units = 1

# Making presets and the split library: as fast as release, so the Live Tester and recording keep
# up, but a developer build like `cargo run`'s, which edits the source tree's presets and library.
# Those go by debug assertions. `cargo dev` runs it.
[profile.dev-release]
inherits = "release"
debug-assertions = true
lto = false
codegen-units = 16
strip = false

# The tests in CI: as fast as release where the golden tests need it, without the link-time
# optimization that only the shipped binary needs, which makes every test binary slow to build
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

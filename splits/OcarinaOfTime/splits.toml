game = "The Legend of Zelda: Ocarina of Time"

[[split]]
name = "reset"
mask = "reset.png"
threshold = 0.96
pause = 0.1
description = "Automatically reset when pressing C-up in Link's house (With rupee count to prevent resetting after a savewarp)"
base_image = "base_links_house.png"

[[split]]
name = "start_auto_splitter"
mask = "start.png"
threshold = 0.96
pause = 10.0
below = true
description = "Starts the auto splitter when you move after pressing C-up."
base_image = "base_links_house.png"

[[split]]
name = "Escape"
mask = "escape.png"
threshold = 0.97
delay = 150
description = "Aqua escape in Lost Woods, splits on full white fade."
base_image = "base_aqua_escape.png"

[[split]]
name = "Bottle"
mask = "bottle.png"
threshold = 0.93
pause = 35.0
delay = 1100
below = true
description = "Splits on bottle model over head, common manual split timing."
base_image = "base_bottle.png"

[[split]]
name = "WhiteFlash"
mask = "WhiteFlash.png"
threshold = 0.97
savestate = "011 wrong warp.gzs"
description = "White flash after a wrong warp/blue warp cutscene skip."
base_image = "base_WhiteFlash.png"

[[split]]
name = "Ganon"
mask = "final_slash_zelda.png"
threshold = 0.92
description = "Final slash on Ganon, standard RTA ending frame."
base_image = "base_ganon.png"

[[split]]
name = "KokiriSwordRight"
mask = "KokiriSwordRight.png"
threshold = 0.96
savestate = "000-kokiri_forest.gzs"
description = "Kokiri Sword, split on model above head."
base_image = "base_KokiriSwordRight.png"

[[split]]
name = "KokiriSwordLeft"
with_previous = true
mask = "KokiriSwordLeft.png"
threshold = 0.96
savestate = "001-kokiri_forest.gzs"
base_image = "base_KokiriSwordLeft.png"
then = true

[[split]]
name = "FastBlackFade"
mask = "FastBlackFade.png"
fade = "#000000"
fade_time = 200
threshold = 0.995
description = "Fast fade to black, like entering Kokiri Shop."
base_image = "base_FastBlackFade.png"

[[split]]
name = "FullWhiteFade"
mask = "FullWhiteFade.png"
fade = "#a0a0a0"
fade_time = 800
threshold = 0.995
description = "Splits on a normal-length full-white fade (White fades are actually pretty gray in Ocarina of Time)."
base_image = "base_FullWhiteFade.png"

[[split]]
name = "DekuCSDummy"
mask = "DekuCSDummy.png"
threshold = 0.94
pause = 6.5
dummy = true
savestate = "005 enter deku dummy.gzs"
description = "Splits on full fade upon entering Deku Tree, after the cutscene of him opening his mouth."
base_image = "base_DekuCSDummy.png"

[[split]]
name = "EnterDeku"
mask = "EnterDeku.png"
fade = "#000000"
fade_time = 800
threshold = 0.995
base_image = "base_EnterDeku.png"
then = true

[[split]]
name = "FullBlackFade"
mask = "FullBlackFade.png"
fade = "#000000"
fade_time = 800
threshold = 0.995
description = "Splits on a normal full-length black fade."
base_image = "base_FullBlackFade.png"

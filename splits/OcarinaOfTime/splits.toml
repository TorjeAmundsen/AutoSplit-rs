game = "The Legend of Zelda: Ocarina of Time"

[[split]]
name = "reset"
mask = "reset.png"
threshold = 0.96
pause = 0.1
description = "Automatically reset when pressing C-up in Link's house"
base_image = "base_links_house.png"

[[split]]
name = "start_auto_splitter"
mask = "start.png"
threshold = 0.96
pause = 10.0
below = true
description = "Starts the auto splitter when you move after pressing C-up"
base_image = "base_links_house.png"

[[split]]
name = "Escape"
mask = "escape.png"
threshold = 0.97
delay = 150
description = "Aqua escape, splits on full white fade"
base_image = "base_aqua_escape.png"

[[split]]
name = "Bottle"
mask = "bottle.png"
threshold = 0.93
pause = 35.0
delay = 1100
below = true
description = "Splits on bottle model over head, common manual split timing"
base_image = "base_bottle.png"

[[split]]
name = "Full white fade"
mask = "full_fade.png"
threshold = 0.97
description = "Generic white fade transition or white flash after successful wrong warp"
base_image = "base_white_fade.png"

[[split]]
name = "Ganon"
mask = "final_slash_zelda.png"
threshold = 0.92
description = "Final slash on Ganon"
base_image = "base_ganon.png"

[[split]]
name = "DekuCSDummy"
mask = "DekuCSDummy.png"
threshold = 0.94
pause = 6.5
dummy = true
savestate = "004-kokiri forest.gzs"
description = "Enter Deku Tree after watching the cutscene where he opens his mouth. Splits on full fade"
base_image = "base_DekuCSDummy.png"

[[split]]
name = "EnterDeku"
mask = "EnterDeku.png"
threshold = 0.92
pause = 60.0
delay = 1000
savestate = "005-kokiri forest.gzs"
instructions = "After loading, advance 1 frame before taking your screenshot. The A button doesn't render correctly if the savestate is on the frame itself, so it had to be 1 frame before."
base_image = "base_EnterDeku.png"
then = true

[[split]]
name = "KokiriSwordRight"
mask = "KokiriSwordRight.png"
threshold = 0.96
savestate = "000-kokiri_forest.gzs"
description = "Kokiri Sword, split on model above head"
base_image = "base_KokiriSwordRight.png"

[[split]]
name = "KokiriSwordLeft"
with_previous = true
mask = "KokiriSwordLeft.png"
threshold = 0.96
savestate = "001-kokiri_forest.gzs"
base_image = "base_KokiriSwordLeft.png"
then = true

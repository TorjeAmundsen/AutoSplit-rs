game = "The Legend of Zelda: Ocarina of Time (2026)"

[[split]]
name = "start_auto_splitter"
mask = "start_auto_splitter.png"
screenshot = "screenshot_start_auto_splitter.png"
threshold = 0.995
pause = 10.0
description = "Starts when pressing A to start a fresh file."
base_image = "base_start_auto_splitter.png"

[[split]]
name = "reset"
mask = "reset.png"
screenshot = "screenshot_reset.png"
threshold = 0.995
pause = 0.0
description = "Resets when you're about to start a new file."
base_image = "base_reset.png"

[[split]]
name = "Slingshot"
mask = "Slingshot.png"
screenshot = "screenshot_Slingshot.png"
threshold = 0.95
description = "Splits on the first frame the item model appears."
base_image = "base_Slingshot.png"


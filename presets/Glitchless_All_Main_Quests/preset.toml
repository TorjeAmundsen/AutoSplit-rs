name = "Glitchless All Main Quests"
game = "The Legend of Zelda: Ocarina of Time"

[[split]]
name = "reset"
mask = "reset.png"
threshold = 0.96
pause = 0.1
savestate = "savestates/000 start and reset.gzs"
instructions = "If loading this state from outside of Link's house, you have to advance 1 frame to make the background render correctly."


name: Dev build

# Publishes the zips from each push to main as the latest-dev pre-release. Runs after Validate
# instead of building again, and only when every Validate job passed.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

# A newer push waiting here replaces an older one that hasn't started
concurrency:
  group: dev-build

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Publish latest-dev
        run: |
          # Validate runs can finish out of order, so an older push must not replace a newer one
          main=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$main" != "$HEAD_SHA" ]; then
            echo "main is at $main now, not $HEAD_SHA. Leaving latest-dev to that run."
            exit 0
          fi

          # A push that only changed docs, presets or splits skips the build job
          builds=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("build-"))] | length')
          if [ "$builds" -eq 0 ]; then
            echo "Validate built nothing for $HEAD_SHA. Leaving latest-dev as it is."
            exit 0
          fi

          gh run download "$RUN_ID" --pattern 'build-*' --dir artifacts

          # Recreated instead of updated, so the tag moves to this commit and zips named after
          # an older version don't stay behind
          if gh release view latest-dev > /dev/null 2>&1; then
            gh release delete latest-dev --cleanup-tag --yes
          fi
          gh release create latest-dev artifacts/*/*.zip \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Latest dev build" \
            --notes "Built from $HEAD_SHA on main. Not a release: it has whatever was merged last and may be broken."

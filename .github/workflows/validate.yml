name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the release workflow, so releases are built and tested the same way
  workflow_call:

jobs:
  # What a pull request or push to main changed, so jobs that can't be affected are skipped.
  # Releases and manual runs skip the filter, and its outputs fall back to true.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
      data: ${{ steps.filter.outputs.data || 'true' }}
    steps:
      # Two commits, so a pull request's merge commit has its base as HEAD^1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # code: a changed file isn't docs, presets, splits or a script nothing in CI runs.
      # data: presets, splits or what checks them changed.
      - name: Sort the changed files
        id: filter
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$BEFORE
            # A force push can leave nothing to compare with
            if ! git fetch --depth=1 origin "$base"; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "data=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          code=false
          data=false
          grep -qvE '(\.md$|^docs/|^presets/|^splits/|^tools/)' <<< "$files" && code=true
          grep -qE '^(presets/|splits/|tools/check_savestates\.py$|\.github/workflows/validate\.yml$)' <<< "$files" && data=true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "data=$data" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Only main saves, which every branch can read, so pull requests don't push its caches out
      # of the repo's 10 GB. A run that fails still saves what it compiled.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # libjpeg-turbo is built from source, its x64 SIMD code with NASM (CMake is preinstalled)
      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Draws every window without a display, which catches UI errors that only show when it runs
      - name: Render the windows
        run: cargo run -p autosplit --example screenshots -- "$RUNNER_TEMP"

  # gz 0.3.7 loads savestates from newer gz builds without complaint, then crashes the game
  savestates:
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check savestates were saved with gz 0.3.7
        run: python3 tools/check_savestates.py

  # The tests that read presets/ and splits/, for changes to only those. The data is the same on
  # every platform, so Linux x64 is enough. A code change runs them in the build job instead.
  preset-tests:
    needs: changes
    if: needs.changes.outputs.data == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Reads the linux-x64 build job's cache and never saves, so it can't replace that cache
      # with one that only has these tests
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          save-if: false

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Test presets and splits
        run: |
          cargo test --profile ci -p autosplit-core --test preset --test mask
          cargo test --profile ci -p autosplit --test gui bundled_presets

  # Pushes to main are published as latest-dev, so they get a version that can't pass for the
  # release in Cargo.toml: the commits on main since the last release tag, then this commit.
  # Empty for anything else. A job of its own, since the build and macos-universal jobs both
  # name their zips with it.
  dev-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Name the dev version
        id: name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet --unshallow --tags origin
          base=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$base" ]; then
            echo "::error::Couldn't find the [workspace.package] version in Cargo.toml"
            exit 1
          fi
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          # Cargo.toml is bumped by hand after a release. Until then a dev build would be named
          # as a prerelease of the version already out.
          if [ "$tag" = "v$base" ]; then
            echo "::error::Cargo.toml still says $base, which was released as $tag. Bump the version."
            exit 1
          fi
          count=$(git rev-list --count --first-parent "$tag..HEAD")
          version="$base-dev.$count+$(git rev-parse --short HEAD)"
          echo "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [changes, dev-version]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          # Ubuntu 22.04 so the binaries run on its glibc and anything newer
          - name: linux-x64
            os: ubuntu-22.04
          - name: linux-arm64
            os: ubuntu-22.04-arm
          # The two halves of the universal binary, built at the same time on their own runners
          # and put together by the macos-universal job. Both are Apple Silicon, so the x64 half
          # is cross-compiled and tested under Rosetta 2.
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      # Shared by name instead of keyed by job, so preset-tests can read the linux-x64 one
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install NASM
        if: matrix.name == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y nasm

      # The lint job only sees Linux code; the Windows and macOS backends are linted here. Linux
      # x64 is the lint job's own, and macOS x64 has the same code as macOS arm64.
      - name: Clippy
        if: matrix.name != 'linux-x64' && matrix.name != 'macos-x64'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: matrix.name != 'macos-x64'
        run: cargo test --workspace --profile ci

      - name: Test x64 under Rosetta 2
        if: matrix.name == 'macos-x64'
        run: cargo test --workspace --profile ci --target ${{ matrix.target }}

      # Set after the tests, which don't need it, so they don't rebuild
      - name: Use the dev version
        if: needs.dev-version.outputs.version
        shell: bash
        run: echo "AUTOSPLIT_VERSION=${{ needs.dev-version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build release zip
        if: "!matrix.target"
        shell: pwsh
        run: ./build.ps1 ${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        if: "!matrix.target"
        with:
          name: build-${{ matrix.name }}
          path: build/AutoSplit-*-${{ matrix.name }}.zip
          if-no-files-found: error

      # A macOS half is only its binary, zipped by the macos-universal job. Not named build-, so
      # releases and latest-dev don't pick it up.
      - name: Build the binary
        if: matrix.target
        run: cargo build --release -p autosplit --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        if: matrix.target
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/autosplit
          if-no-files-found: error

  # The universal macOS zip, from the two halves the build job made
  macos-universal:
    needs: [dev-version, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use the dev version
        if: needs.dev-version.outputs.version
        run: echo "AUTOSPLIT_VERSION=${{ needs.dev-version.outputs.version }}" >> "$GITHUB_ENV"

      # Where build.ps1 would have built them
      - uses: actions/download-artifact@v8
        with:
          name: binary-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release

      - uses: actions/download-artifact@v8
        with:
          name: binary-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release

      - name: Build release zip
        shell: pwsh
        run: ./build.ps1 macos-universal --prebuilt

      # Starts both halves of the universal binary that ships, which the tests don't run, so a
      # framework call newer than the minimum macOS version shows up as a load error here
      - name: Start the shipped binary
        run: |
          unzip -q build/AutoSplit-*-macos-universal.zip -d "$RUNNER_TEMP/zip"
          arch -arm64 "$RUNNER_TEMP/zip/autosplit" --version
          arch -x86_64 "$RUNNER_TEMP/zip/autosplit" --version
          launchctl plist __TEXT,__info_plist "$RUNNER_TEMP/zip/autosplit"

      - uses: actions/upload-artifact@v7
        with:
          name: build-macos-universal
          path: build/AutoSplit-*-macos-universal.zip
          if-no-files-found: error

  # The one check for branch protection to require. Skipped jobs pass, failed or cancelled ones
  # don't, so it holds whatever the changes job picked.
  ci-passed:
    name: CI passed
    needs: [changes, dev-version, lint, savestates, preset-tests, build, macos-universal]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check no job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
